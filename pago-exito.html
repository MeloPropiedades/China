<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago exitoso · China Mates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --hueso: #F2EEE8;
    --greige: #E8E0D3;
    --carbon-topo: #4D4944;
    --cafe-arcilla: #6B5544;
    --verde-salvia: #4a7c59;
    --texto-suave: #8B847D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--hueso);
    color: var(--carbon-topo);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .card {
    background: #fff;
    max-width: 520px;
    width: 100%;
    padding: 3rem 2.5rem;
    text-align: center;
    border: 1px solid var(--greige);
  }
  .check-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--verde-salvia);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    margin: 0 auto 1.75rem;
    box-shadow: 0 4px 20px rgba(74,124,89,0.3);
  }
  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    color: var(--carbon-topo);
  }
  p {
    color: var(--texto-suave);
    line-height: 1.6;
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }
  .pedido-info {
    background: var(--greige);
    padding: 1rem 1.25rem;
    margin: 1.5rem 0;
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--carbon-topo);
  }
  .pedido-info strong { font-weight: 500; }
  .btn-volver {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 14px 32px;
    background: var(--carbon-topo);
    color: var(--hueso);
    text-decoration: none;
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  .btn-volver:hover { background: var(--cafe-arcilla); }
  .nota {
    margin-top: 1.5rem;
    padding: 12px 14px;
    background: #fdf6e7;
    border-left: 3px solid #d4a84c;
    font-size: 0.82rem;
    color: #7a5e14;
    text-align: left;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check-icon">✓</div>
    <h1>¡Pago procesado!</h1>
    <p>Recibimos tu pago. Tu pedido ya está siendo preparado.</p>

    <div class="pedido-info" id="pedido-info">
      Pedido: <strong id="pedido-id">—</strong>
    </div>

    <div class="nota">
      📧 Si pagaste con tarjeta, el cargo puede tardar hasta <strong>2 minutos</strong> en aparecer como confirmado en nuestro sistema. Si necesitás ayuda, escribinos por WhatsApp.
    </div>

    <a href="/" class="btn-volver">← Volver a la tienda</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const pedido = params.get('pedido');
  if (pedido) {
    document.getElementById('pedido-id').textContent = '#' + pedido.slice(-6).toUpperCase();
  } else {
    document.getElementById('pedido-info').style.display = 'none';
  }
</script>
</body>
</html>
